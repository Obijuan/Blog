name: Deploy Zola site to GitHub Pages

on:
  push:
    branches:
      - main  # Cambia a 'master' si tu rama predeterminada se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: true  # Descarga el tema desde el submódulo
          fetch-depth: 0

      - name: Instalar Zola
        uses: davebarnes/setup-zola@v1
        with:
          version: 'v0.22.1'

      - name: Compilar sitio con Zola
        run: zola build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        